name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Yarn (jika belum ada)
        run: npm install -g yarn

      - name: Install dependencies with Yarn
        run: yarn install --frozen-lockfile   # pakai lockfile biar konsisten

      - name: Build TypeScript
        run: yarn build                       # atau npm run build, tapi lebih aman yarn

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
